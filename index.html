<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9fc" />
  <title>マイボディ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1>マイボディ</h1>
        <p>継続が、理想のカラダをつくる</p>
      </div>
      <button class="icon-button" id="open-register-header" aria-label="記録を追加">＋</button>
    </header>

    <main>

                  <path d="M77 125 C61 132 50 149 44 170 L24 257 C19 276 23 291 34 295 C45 299 55 290 60 272 L84 190"/>
                  <path d="M183 125 C199 132 210 149 216 170 L236 257 C241 276 237 291 226 295 C215 299 205 290 200 272 L176 190"/>
                </g>
                <g filter="url(#softGlowFront)">
                  <path class="muscle-part" data-part="shoulders" d="M81 118 C88 101 102 95 116 98 L110 138 C97 141 86 138 77 129 Z"/>
                  <path class="muscle-part" data-part="shoulders" d="M179 118 C172 101 158 95 144 98 L150 138 C163 141 174 138 183 129 Z"/>
                  <path class="muscle-part" data-part="chest" d="M95 116 C104 106 118 104 130 111 C119 132 108 146 91 150 L88 127 Z"/>
                  <path class="muscle-part" data-part="chest" d="M165 116 C156 106 142 104 130 111 C141 132 152 146 169 150 L172 127 Z"/>
                  <path class="muscle-part" data-part="arms" d="M74 146 C61 154 56 172 53 191 L38 262 C35 275 39 284 48 286 C56 288 62 281 65 268 L82 195 Z"/>
                  <path class="muscle-part" data-part="arms" d="M186 146 C199 154 204 172 207 191 L222 262 C225 275 221 284 212 286 C204 288 198 281 195 268 L178 195 Z"/>
                  <path class="muscle-part" data-part="abs" d="M108 162 C116 166 123 168 130 168 C137 168 144 166 152 162 L154 256 C146 271 139 279 130 279 C121 279 114 271 106 256 Z"/>
                  <path class="muscle-part" data-part="thighs" d="M87 280 C99 272 113 271 124 279 L121 391 C116 409 108 420 97 425 C87 420 81 409 81 391 Z"/>
                  <path class="muscle-part" data-part="thighs" d="M173 280 C161 272 147 271 136 279 L139 391 C144 409 152 420 163 425 C173 420 179 409 179 391 Z"/>
                  <path class="muscle-part" data-part="calves" d="M82 395 C91 389 105 388 117 393 L115 498 C111 517 104 527 96 530 C86 527 80 517 80 500 Z"/>
                  <path class="muscle-part" data-part="calves" d="M178 395 C169 389 155 388 143 393 L145 498 C149 517 156 527 164 530 C174 527 180 517 180 500 Z"/>
                </g>
                <g class="muscle-lines" fill="none" stroke="#ffffff" stroke-width="2" opacity=".55">
                  <path d="M130 112 L130 262"/>
                  <path d="M106 189 L154 189"/>
                  <path d="M106 217 L154 217"/>
                  <path d="M106 245 L154 245"/>
                </g>
              </svg>
              <div class="callout left c1"><i></i>肩</div>
              <div class="callout left c2"><i></i>胸</div>
              <div class="callout left c3"><i></i>腕</div>
              <div class="callout left c4"><i></i>腹筋</div>
              <div class="callout left c5"><i></i>脚</div>
            </div>

            <div class="figure-wrap figure-back">
              <span class="body-label">背面</span>
              <svg class="anatomy-svg" viewBox="0 0 260 560" aria-label="人体背面">
                <defs>
                  <filter id="softGlowBack" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="4.5" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                  <linearGradient id="shellBack" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#fcfeff"/>
                    <stop offset="55%" stop-color="#eef4fa"/>
                    <stop offset="100%" stop-color="#e5edf6"/>
                  </linearGradient>
                </defs>
                <g fill="url(#shellBack)">
                  <circle cx="130" cy="54" r="31"/>
                  <path d="M98 88 C84 95 73 109 70 132 C67 155 72 182 77 211 C81 235 83 265 82 302 L80 478 C80 511 93 530 109 530 C121 530 128 517 129 500 L130 337 L130 337 L131 500 C132 517 139 530 151 530 C167 530 180 511 180 478 L178 302 C177 265 179 235 183 211 C188 182 193 155 190 132 C187 109 176 95 162 88 C154 96 143 101 130 101 C117 101 106 96 98 88 Z"/>
                  <path d="M77 125 C61 132 50 149 44 170 L24 257 C19 276 23 291 34 295 C45 299 55 290 60 272 L84 190 Z"/>
                  <path d="M183 125 C199 132 210 149 216 170 L236 257 C241 276 237 291 226 295 C215 299 205 290 200 272 L176 190 Z"/>
                </g>
                <g fill="none" stroke="#ffffff" stroke-width="3" opacity=".9">
                  <circle cx="130" cy="54" r="31"/>
                  <path d="M98 88 C84 95 73 109 70 132 C67 155 72 182 77 211 C81 235 83 265 82 302 L80 478 C80 511 93 530 109 530 C121 530 128 517 129 500 L130 337 L131 500 C132 517 139 530 151 530 C167 530 180 511 180 478 L178 302 C177 265 179 235 183 211 C188 182 193 155 190 132 C187 109 176 95 162 88"/>
                </g>
                <g filter="url(#softGlowBack)">
                  <path class="muscle-part" data-part="shoulders" d="M81 118 C88 101 102 95 116 98 L110 138 C97 141 86 138 77 129 Z"/>
                  <path class="muscle-part" data-part="shoulders" d="M179 118 C172 101 158 95 144 98 L150 138 C163 141 174 138 183 129 Z"/>
                  <path class="muscle-part" data-part="back" d="M98 110 C106 102 117 100 130 106 C143 100 154 102 162 110 L172 185 C164 217 149 240 130 251 C111 240 96 217 88 185 Z"/>

                  <path class="muscle-part" data-part="glutes" d="M91 252 C101 244 115 243 130 252 L130 309 C114 317 100 317 87 307 Z"/>
                  <path class="muscle-part" data-part="glutes" d="M169 252 C159 244 145 243 130 252 L130 309 C146 317 160 317 173 307 Z"/>
                  <path class="muscle-part" data-part="thighs" d="M87 308 C99 300 113 299 124 307 L121 391 C116 409 108 420 97 425 C87 420 81 409 81 391 Z"/>
                  <path class="muscle-part" data-part="thighs" d="M173 308 C161 300 147 299 136 307 L139 391 C144 409 152 420 163 425 C173 420 179 409 179 391 Z"/>
                  <path class="muscle-part" data-part="calves" d="M82 395 C91 389 105 388 117 393 L115 498 C111 517 104 527 96 530 C86 527 80 517 80 500 Z"/>
                  <path class="muscle-part" data-part="calves" d="M178 395 C169 389 155 388 143 393 L145 498 C149 517 156 527 164 530 C174 527 180 517 180 500 Z"/>
                </g>
                <g class="muscle-lines" fill="none" stroke="#ffffff" stroke-width="2" opacity=".46">
                  <path d="M130 107 L130 251"/>
                </g>
              </svg>
              <div class="callout right c1"><i></i>背中</div>
              <div class="callout right c2"><i></i>お尻</div>
              <div class="callout right c3"><i></i>太もも</div>
              <div class="callout right c4"><i></i>ふくらはぎ</div>
            </div>
</div>
        </div>

        <button class="primary floating-action" id="open-register">＋ 記録する</button>
      </section>

      <section class="screen" id="screen-history">
        <div class="section-heading">
          <h2>トレーニング履歴</h2>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>

      <section class="screen" id="screen-settings">
        <div class="section-heading">
          <h2>設定</h2>
          <p>色の基準や種目マスタを管理できます</p>
        </div>

        <div class="card settings-card">
          <div class="threshold-grid">
            <label>
              <span>青の基準</span>
              <div><input type="number" id="threshold-blue" min="1" step="1"><span>pt</span></div>
            </label>
            <label>
              <span>黄の基準</span>
              <div><input type="number" id="threshold-yellow" min="2" step="1"><span>pt</span></div>
            </label>
            <label>
              <span>赤の基準</span>
              <div><input type="number" id="threshold-red" min="3" step="1"><span>pt</span></div>
            </label>
          </div>
          <div class="gradient-bar large"></div>
          <button class="secondary full-width" id="save-thresholds">色設定を保存</button>
          <p id="threshold-message" class="form-message"></p>
        </div>

        <div class="card settings-card">
          <div class="section-title-row">
            <div>
              <h3>種目管理</h3>
            </div>
            <button class="small-button" id="open-exercise-editor">＋ 種目追加</button>
          </div>
          <input class="search-input" id="settings-exercise-search" type="search" placeholder="種目を検索">
          <div id="exercise-master-list" class="master-list"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-target="home"><span>⌂</span><small>ホーム</small></button>
      <button class="nav-item" data-target="history"><span>≡</span><small>履歴</small></button>
      <button class="nav-item" data-target="settings"><span>⚙</span><small>設定</small></button>
    </nav>
  </div>

  <div class="modal-backdrop hidden" id="register-backdrop">
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2>トレーニングを登録</h2>
        <button class="icon-button ghost" id="close-register">×</button>
      </div>

      <label class="form-field">
        <span>日付</span>
        <input type="date" id="record-date">
      </label>

      <div class="form-field">
        <span>種目</span>
        <button class="select-like" id="open-exercise-picker">
          <span id="selected-exercise-label">種目を選択</span><span>›</span>
        </button>
        <p class="helper">部位は選択した種目に応じて自動で設定されます。</p>
      </div>

      <label class="form-field">
        <span id="value-label">回数</span>
        <div class="unit-input">
          <input type="number" id="record-value" min="1" step="1" placeholder="10">
          <span id="value-unit">回</span>
        </div>
      </label>

      <div class="modal-actions">
        <button class="secondary" id="cancel-register">キャンセル</button>
        <button class="primary" id="save-record">登録する</button>
      </div>
      <p id="register-message" class="form-message"></p>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="picker-backdrop">
    <div class="bottom-sheet picker-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2>種目を選択</h2>
        <button class="icon-button ghost" id="close-picker">×</button>
      </div>
      <div id="part-filter" class="chip-row"></div>
      <input class="search-input" id="exercise-search" type="search" placeholder="種目を検索">
      <div id="exercise-picker-list" class="picker-list"></div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="exercise-editor-backdrop">
    <div class="bottom-sheet editor-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 id="exercise-editor-title">種目を追加</h2>
        <button class="icon-button ghost" id="close-exercise-editor">×</button>
      </div>

      <label class="form-field">
        <span>種目名</span>
        <input type="text" id="custom-name" placeholder="例：チューブローイング">
      </label>

      <label class="form-field">
        <span>記録方法</span>
        <select id="custom-input-type">
          <option value="reps">回数</option>
          <option value="duration">時間</option>
        </select>
      </label>

      <div class="form-field">
        <span>対象部位とポイント係数</span>
        <p class="helper">最低1部位を選択してください。主対象1.0 / 副対象0.5 / 補助0.25 が目安です。</p>
        <div id="custom-muscles" class="muscle-config-list"></div>
      </div>

      <div class="modal-actions">
        <button class="secondary" id="cancel-exercise-editor">キャンセル</button>
        <button class="primary" id="save-custom-exercise">保存</button>
      </div>
      <p id="custom-message" class="form-message"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
