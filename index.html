<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9fc" />
  <title>マイボディ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <h1>マイボディ</h1>
        <p>継続が、理想のカラダをつくる</p>
      </div>
      <button class="icon-button" id="open-register-header" aria-label="記録を追加">＋</button>
    </header>

    <main>
      <section class="screen active" id="screen-home">
        <div class="hero-body-card">
          <div class="body-stage">
            <div class="figure-wrap">
              <span class="body-label">前面</span>
              <svg class="anatomy-svg" viewBox="0 0 260 560" aria-label="人体前面">
                <defs>
                  <filter id="softGlowFront" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="5" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                  <linearGradient id="bodyBaseFront" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fbff"/><stop offset="55%" stop-color="#edf3f9"/><stop offset="100%" stop-color="#e6edf5"/>
                  </linearGradient>
                </defs>
                <g class="body-shell" fill="url(#bodyBaseFront)">
                  <ellipse cx="130" cy="45" rx="30" ry="36"/>
                  <path d="M104 76 C88 83 72 95 63 117 C56 134 57 153 64 174 L76 221 C80 237 76 260 68 278 C62 292 57 309 58 331 L67 504 C68 525 81 541 98 541 C111 541 119 531 120 514 L124 324 L136 324 L140 514 C141 531 149 541 162 541 C179 541 192 525 193 504 L202 331 C203 309 198 292 192 278 C184 260 180 237 184 221 L196 174 C203 153 204 134 197 117 C188 95 172 83 156 76 C149 82 140 87 130 87 C120 87 111 82 104 76 Z"/>
                  <path d="M67 115 C50 121 38 138 32 160 L13 259 C10 276 18 290 31 292 C43 294 51 284 54 269 L77 183 Z"/>
                  <path d="M193 115 C210 121 222 138 228 160 L247 259 C250 276 242 290 229 292 C217 294 209 284 206 269 L183 183 Z"/>
                </g>
                <g class="body-outline" fill="none" stroke="#ffffff" stroke-width="3" opacity=".9">
                  <ellipse cx="130" cy="45" rx="30" ry="36"/>
                  <path d="M104 76 C88 83 72 95 63 117 C56 134 57 153 64 174 L76 221 C80 237 76 260 68 278 C62 292 57 309 58 331 L67 504 C68 525 81 541 98 541 C111 541 119 531 120 514 L124 324 L136 324 L140 514 C141 531 149 541 162 541 C179 541 192 525 193 504 L202 331 C203 309 198 292 192 278 C184 260 180 237 184 221 L196 174 C203 153 204 134 197 117 C188 95 172 83 156 76"/>
                </g>
                <g filter="url(#softGlowFront)">
                  <path class="muscle-part muscle-soft" data-part="shoulders" d="M72 112 C83 91 101 86 115 95 L107 132 C94 135 82 132 70 125 Z"/>
                  <path class="muscle-part muscle-soft" data-part="shoulders" d="M188 112 C177 91 159 86 145 95 L153 132 C166 135 178 132 190 125 Z"/>
                  <path class="muscle-part muscle-soft" data-part="chest" d="M105 103 C113 95 124 94 130 99 L130 151 C117 159 102 157 89 148 L91 113 Z"/>
                  <path class="muscle-part muscle-soft" data-part="chest" d="M155 103 C147 95 136 94 130 99 L130 151 C143 159 158 157 171 148 L169 113 Z"/>
                  <path class="muscle-part muscle-soft" data-part="arms" d="M68 130 C54 140 49 159 45 181 L30 258 C28 270 33 278 41 278 C48 278 52 271 54 261 L75 173 Z"/>
                  <path class="muscle-part muscle-soft" data-part="arms" d="M192 130 C206 140 211 159 215 181 L230 258 C232 270 227 278 219 278 C212 278 208 271 206 261 L185 173 Z"/>
                  <path class="muscle-part muscle-soft" data-part="abs" d="M108 156 C116 160 123 162 130 162 C137 162 144 160 152 156 L155 249 C147 263 139 270 130 270 C121 270 113 263 105 249 Z"/>
                  <path class="muscle-part muscle-soft" data-part="thighs" d="M75 278 C88 267 105 267 119 276 L118 392 C111 410 101 421 88 421 C77 421 70 410 69 393 Z"/>
                  <path class="muscle-part muscle-soft" data-part="thighs" d="M185 278 C172 267 155 267 141 276 L142 392 C149 410 159 421 172 421 C183 421 190 410 191 393 Z"/>
                  <path class="muscle-part muscle-soft" data-part="calves" d="M70 398 C81 389 103 390 116 400 L112 506 C108 523 99 531 89 531 C78 531 71 520 71 505 Z"/>
                  <path class="muscle-part muscle-soft" data-part="calves" d="M190 398 C179 389 157 390 144 400 L148 506 C152 523 161 531 171 531 C182 531 189 520 189 505 Z"/>
                </g>
                <g class="muscle-lines" fill="none" stroke="#ffffff" stroke-width="2" opacity=".55">
                  <path d="M130 102 L130 255"/><path d="M108 182 L152 182"/><path d="M107 208 L153 208"/><path d="M106 235 L154 235"/>
                </g>
              </svg>
              <div class="callout left c1"><i></i>肩</div>
              <div class="callout left c2"><i></i>胸</div>
              <div class="callout left c3"><i></i>腕</div>
              <div class="callout left c4"><i></i>腹筋</div>
            </div>

            <div class="figure-wrap">
              <span class="body-label">背面</span>
              <svg class="anatomy-svg" viewBox="0 0 260 560" aria-label="人体背面">
                <defs>
                  <filter id="softGlowBack" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="5" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                  <linearGradient id="bodyBaseBack" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f8fbff"/><stop offset="55%" stop-color="#edf3f9"/><stop offset="100%" stop-color="#e6edf5"/>
                  </linearGradient>
                </defs>
                <g class="body-shell" fill="url(#bodyBaseBack)">
                  <ellipse cx="130" cy="45" rx="30" ry="36"/>
                  <path d="M104 76 C88 83 72 95 63 117 C56 134 57 153 64 174 L76 221 C80 237 76 260 68 278 C62 292 57 309 58 331 L67 504 C68 525 81 541 98 541 C111 541 119 531 120 514 L124 324 L136 324 L140 514 C141 531 149 541 162 541 C179 541 192 525 193 504 L202 331 C203 309 198 292 192 278 C184 260 180 237 184 221 L196 174 C203 153 204 134 197 117 C188 95 172 83 156 76 C149 82 140 87 130 87 C120 87 111 82 104 76 Z"/>
                  <path d="M67 115 C50 121 38 138 32 160 L13 259 C10 276 18 290 31 292 C43 294 51 284 54 269 L77 183 Z"/>
                  <path d="M193 115 C210 121 222 138 228 160 L247 259 C250 276 242 290 229 292 C217 294 209 284 206 269 L183 183 Z"/>
                </g>
                <g filter="url(#softGlowBack)">
                  <path class="muscle-part muscle-soft" data-part="shoulders" d="M72 112 C83 91 101 86 115 95 L107 132 C94 135 82 132 70 125 Z"/>
                  <path class="muscle-part muscle-soft" data-part="shoulders" d="M188 112 C177 91 159 86 145 95 L153 132 C166 135 178 132 190 125 Z"/>
                  <path class="muscle-part muscle-soft" data-part="back" d="M102 102 C112 95 122 93 130 98 C138 93 148 95 158 102 L175 182 C163 212 149 232 130 244 C111 232 97 212 85 182 Z"/>
                  <path class="muscle-part muscle-soft" data-part="arms" d="M68 130 C54 140 49 159 45 181 L30 258 C28 270 33 278 41 278 C48 278 52 271 54 261 L75 173 Z"/>
                  <path class="muscle-part muscle-soft" data-part="arms" d="M192 130 C206 140 211 159 215 181 L230 258 C232 270 227 278 219 278 C212 278 208 271 206 261 L185 173 Z"/>
                  <path class="muscle-part muscle-soft" data-part="glutes" d="M82 242 C98 231 116 233 130 245 L130 307 C113 318 95 317 80 303 Z"/>
                  <path class="muscle-part muscle-soft" data-part="glutes" d="M178 242 C162 231 144 233 130 245 L130 307 C147 318 165 317 180 303 Z"/>
                  <path class="muscle-part muscle-soft" data-part="thighs" d="M75 304 C88 295 105 294 119 304 L118 392 C111 410 101 421 88 421 C77 421 70 410 69 393 Z"/>
                  <path class="muscle-part muscle-soft" data-part="thighs" d="M185 304 C172 295 155 294 141 304 L142 392 C149 410 159 421 172 421 C183 421 190 410 191 393 Z"/>
                  <path class="muscle-part muscle-soft" data-part="calves" d="M70 398 C81 389 103 390 116 400 L112 506 C108 523 99 531 89 531 C78 531 71 520 71 505 Z"/>
                  <path class="muscle-part muscle-soft" data-part="calves" d="M190 398 C179 389 157 390 144 400 L148 506 C152 523 161 531 171 531 C182 531 189 520 189 505 Z"/>
                </g>
                <g class="muscle-lines" fill="none" stroke="#ffffff" stroke-width="2" opacity=".45"><path d="M130 98 L130 244"/><path d="M130 245 L130 310"/></g>
              </svg>
              <div class="callout right c1"><i></i>背中</div>
              <div class="callout right c2"><i></i>お尻</div>
              <div class="callout right c3"><i></i>太もも</div>
              <div class="callout right c4"><i></i>ふくらはぎ</div>
            </div>
          </div>
        </div>

        <button class="primary floating-action" id="open-register">＋ 記録する</button>
      </section>

      <section class="screen" id="screen-history">
        <div class="section-heading">
          <h2>トレーニング履歴</h2>
          <p>日ごとの記録を確認できます</p>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>

      <section class="screen" id="screen-settings">
        <div class="section-heading">
          <h2>設定</h2>
          <p>色の基準や種目マスタを管理できます</p>
        </div>

        <div class="card settings-card">
          <h3>色の基準設定</h3>
          <p class="muted">ポイントに応じて白→青→黄→赤へ滑らかに変化します。</p>
          <div class="threshold-grid">
            <label>
              <span>青の基準</span>
              <div><input type="number" id="threshold-blue" min="1" step="1"><span>pt</span></div>
            </label>
            <label>
              <span>黄の基準</span>
              <div><input type="number" id="threshold-yellow" min="2" step="1"><span>pt</span></div>
            </label>
            <label>
              <span>赤の基準</span>
              <div><input type="number" id="threshold-red" min="3" step="1"><span>pt</span></div>
            </label>
          </div>
          <div class="gradient-bar large"></div>
          <button class="secondary full-width" id="save-thresholds">色設定を保存</button>
          <p id="threshold-message" class="form-message"></p>
        </div>

        <div class="card settings-card">
          <div class="section-title-row">
            <div>
              <h3>種目管理</h3>
              <p class="muted">自宅トレーニングを中心に初期登録済みです。</p>
            </div>
            <button class="small-button" id="open-exercise-editor">＋ 種目追加</button>
          </div>
          <input class="search-input" id="settings-exercise-search" type="search" placeholder="種目を検索">
          <div id="exercise-master-list" class="master-list"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-target="home"><span>⌂</span><small>ホーム</small></button>
      <button class="nav-item" data-target="history"><span>≡</span><small>履歴</small></button>
      <button class="nav-item" data-target="settings"><span>⚙</span><small>設定</small></button>
    </nav>
  </div>

  <div class="modal-backdrop hidden" id="register-backdrop">
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2>トレーニングを登録</h2>
        <button class="icon-button ghost" id="close-register">×</button>
      </div>

      <label class="form-field">
        <span>日付</span>
        <input type="date" id="record-date">
      </label>

      <div class="form-field">
        <span>種目</span>
        <button class="select-like" id="open-exercise-picker">
          <span id="selected-exercise-label">種目を選択</span><span>›</span>
        </button>
        <p class="helper">部位は選択した種目に応じて自動で設定されます。</p>
      </div>

      <label class="form-field">
        <span id="value-label">回数</span>
        <div class="unit-input">
          <input type="number" id="record-value" min="1" step="1" placeholder="10">
          <span id="value-unit">回</span>
        </div>
      </label>

      <div class="modal-actions">
        <button class="secondary" id="cancel-register">キャンセル</button>
        <button class="primary" id="save-record">登録する</button>
      </div>
      <p id="register-message" class="form-message"></p>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="picker-backdrop">
    <div class="bottom-sheet picker-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2>種目を選択</h2>
        <button class="icon-button ghost" id="close-picker">×</button>
      </div>
      <div id="part-filter" class="chip-row"></div>
      <input class="search-input" id="exercise-search" type="search" placeholder="種目を検索">
      <div id="exercise-picker-list" class="picker-list"></div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="exercise-editor-backdrop">
    <div class="bottom-sheet editor-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 id="exercise-editor-title">種目を追加</h2>
        <button class="icon-button ghost" id="close-exercise-editor">×</button>
      </div>

      <label class="form-field">
        <span>種目名</span>
        <input type="text" id="custom-name" placeholder="例：チューブローイング">
      </label>

      <label class="form-field">
        <span>記録方法</span>
        <select id="custom-input-type">
          <option value="reps">回数</option>
          <option value="duration">時間</option>
        </select>
      </label>

      <div class="form-field">
        <span>対象部位とポイント係数</span>
        <p class="helper">最低1部位を選択してください。主対象1.0 / 副対象0.5 / 補助0.25 が目安です。</p>
        <div id="custom-muscles" class="muscle-config-list"></div>
      </div>

      <div class="modal-actions">
        <button class="secondary" id="cancel-exercise-editor">キャンセル</button>
        <button class="primary" id="save-custom-exercise">保存</button>
      </div>
      <p id="custom-message" class="form-message"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
